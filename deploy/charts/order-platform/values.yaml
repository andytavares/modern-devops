# Defaults. Environment overlays in deploy/env/<env>/values.yaml override these,
# and CI rewrites the image tags there — never here.
global:
  registry: nexus:8082
  imagePullSecret: nexus-pull

kafka:
  brokers: "orders-kafka-bootstrap.kafka.svc.cluster.local:9092"
  topic: "orders"

aws:
  endpointUrl: "http://floci.floci.svc.cluster.local:4566"
  region: "us-east-1"
  s3Bucket: "orders-raw"
  ddbTable: "orders"
  # Floci accepts any credentials and validates none, so these sentinels are what
  # a local cluster needs to make the AWS SDKs start. They are rendered as plain
  # env vars and are readable by anyone who can `kubectl get deploy`, which is
  # only acceptable because they authenticate nothing.
  #
  # On a real cluster leave both empty. No credential env vars are then rendered
  # and the SDK falls through to its default provider chain, which on EKS means
  # IRSA or EKS Pod Identity: the pod's projected service account token is
  # exchanged for short-lived STS credentials that rotate on their own. Long-lived
  # access keys in a chart, a Secret or a ConfigMap are the thing that mechanism
  # exists to remove — do not reach for the ExternalSecret pattern that
  # ORDER_SIGNING_KEY uses here, because that still stores a static key.
  accessKeyId: "test"
  secretAccessKey: "test"

# A node drain evicts every pod on the node at once, which for a two-replica
# service means a full outage. Rendered per Deployment, and only for Deployments
# with more than one replica: minAvailable 1 against a single replica permits no
# voluntary eviction at all and blocks the drain forever.
# https://kubernetes.io/docs/tasks/run-application/configure-pdb/
podDisruptionBudget:
  enabled: true
  minAvailable: 1

orderApi:
  enabled: true
  image:
    repository: shop/order-api
    tag: "dev"
  replicas: 2
  port: 8000
  secretName: order-api-secrets     # produced by the ExternalSecret in §7.6
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

orderWorker:
  enabled: true
  image:
    repository: shop/order-worker
    tag: "dev"
  replicas: 2          # <= partition count (3), see §8.3
  metricsPort: 9090
  consumerGroup: order-worker
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 128Mi }

# Exactly one of these two should be on. serviceMonitor is the pre-mesh scrape
# path (§13.3); podMonitor replaces it once STRICT mTLS refuses plaintext
# scrapes (§9.6). Both start false because the monitoring.coreos.com CRDs do
# not exist until §13.2 installs kube-prometheus-stack, and Argo CD fails the
# whole Application sync on a resource whose CRD is missing.
serviceMonitor:
  enabled: false
  interval: 15s

pricing:
  enabled: true
  grpcPort: 50051
  httpPort: 9090
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 128Mi }
  v1:
    image:
      repository: shop/pricing
      tag: "dev"
    replicas: 2
  v2:
    image:
      repository: shop/pricing
      tag: "dev"
    replicas: 1

frontend:
  enabled: true
  image:
    repository: shop/frontend
    tag: "dev"
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { memory: 64Mi }

podMonitor:
  # false until §13.2 installs kube-prometheus-stack and with it the
  # monitoring.coreos.com CRDs. Argo CD does not skip a resource whose CRD is
  # missing — it fails the whole sync, so leaving this true strands every
  # workload in `shop` as Missing. Flip to true in §13.3 and commit.
  enabled: false
  interval: 15s

scaffolded:
  tag: "dev"     # CI overwrites this in the env overlay, same as the other two