{{- if .Values.orderApi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-api
  labels: {{- include "op.labels" (dict "name" "order-api" "root" $) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  labels: {{- include "op.labels" (dict "name" "order-api" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.orderApi.replicas }}
  # Kubernetes keeps 10 superseded ReplicaSets per Deployment by default. Three
  # is enough history to roll back through and keeps `kubectl get rs` readable.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: order-api
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- include "op.labels" (dict "name" "order-api" "root" $) | nindent 8 }}
      annotations:
        # Roll the pods whenever this service's rendered config changes. Config
        # reaches the container through envFrom, so the pod template itself does
        # not change when the ConfigMap does and nothing would otherwise restart.
        # Hashing the rendered ConfigMap — not `.Values` — is what scopes the
        # restart to services whose config actually changed; CI rewrites image
        # tags in the env overlay on every build, and a hash over the whole
        # values tree turns each of those into a namespace-wide restart.
        # https://helm.sh/docs/howto/charts_tips_and_tricks/#automatically-roll-deployments
        checksum/config: {{ include (print $.Template.BasePath "/configmap-order-api.yaml") . | sha256sum }}
        # Istio's agent reads these three, scrapes the app over loopback inside
        # the pod, and re-publishes the result merged with Envoy's own metrics
        # on port 15020. That merged endpoint is what Prometheus scrapes — see
        # §9.6 for why it cannot scrape port 8000 directly any more.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.orderApi.port | quote }}
    spec:
      # Kubernetes injects a Docker-link env var per Service in this namespace:
      # ORDER_API_PORT, ORDER_WORKER_PORT, PRICING_PORT, FRONTEND_PORT — each
      # set to "tcp://<clusterIP>:<port>". Any app reading a variable of that
      # name as its own config gets a URL where it expected an integer:
      #   ValueError: invalid literal for int() with base 10: 'tcp://10.96...'
      # Env vars outrank every other config source, so the app cannot win.
      # Service links are a Docker-links relic nothing here uses.
      enableServiceLinks: false
      serviceAccountName: order-api
      imagePullSecrets:
        - name: {{ include "op.imagePullSecret" . }}
      # A shutting-down replica may be holding an in-flight Kafka `send_and_wait`
      # and an S3 PUT; both have to complete or the request is lost with the pod.
      # Matches order-worker so the whole platform has one shutdown budget.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: order-api
          image: {{ include "op.image" (dict "root" $ "img" .Values.orderApi.image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: {{ .Values.orderApi.port }} }
          envFrom:
            - configMapRef: { name: order-api-config }
          env:
            {{- include "op.awsCredentialEnv" . | nindent 12 }}
            # Image identity, not configuration: it tracks the tag, so it belongs
            # in the pod template rather than in the ConfigMap.
            - name: SERVICE_VERSION
              value: {{ .Values.orderApi.image.tag | quote }}
            - name: ORDER_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "orderApi.secretName is required: the Secret the ExternalSecret in §7.6 writes ORDER_SIGNING_KEY into" .Values.orderApi.secretName }}
                  key: ORDER_SIGNING_KEY
          startupProbe:
            # Gives a slow start up to 60s without loosening the liveness probe,
            # which stays tight so a genuinely wedged pod is killed fast.
            httpGet: { path: /healthz, port: http }
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources: {{- toYaml .Values.orderApi.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # order-api is packaged as a PEX, which unpacks its dependency closure
          # on first run and therefore needs somewhere writable. Under
          # readOnlyRootFilesystem it has nowhere and dies in the PEX bootstrap
          # before any application log line appears:
          #   FileNotFoundError: No usable temporary directory found
          # Same fix as pricing. Any service moving to PEX inherits this.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  labels: {{- include "op.labels" (dict "name" "order-api" "root" $) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: order-api
  ports:
    - { name: http, port: 80, targetPort: http }
{{- include "op.pdb" (dict "name" "order-api" "root" $ "replicas" .Values.orderApi.replicas "selector" (dict "app.kubernetes.io/name" "order-api")) }}
{{- end }}
