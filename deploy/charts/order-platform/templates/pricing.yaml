{{- if .Values.pricing.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pricing
  labels: {{- include "op.labels" (dict "name" "pricing" "root" $) | nindent 4 }}
---
{{- range $version, $cfg := (dict "v1" .Values.pricing.v1 "v2" .Values.pricing.v2) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-{{ $version }}
  labels: {{- include "op.labels" (dict "name" "pricing" "root" $) | nindent 4 }}
    version: {{ $version }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing
      version: {{ $version }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- include "op.labels" (dict "name" "pricing" "root" $) | nindent 8 }}
        # Istio subsets select on this label (§9.8 DestinationRule) — it must
        # live on the pod template, not just the Deployment.
        version: {{ $version }}
      annotations:
        checksum/config: {{ toJson $.Values | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ $.Values.pricing.httpPort | quote }}
    spec:
      # Kubernetes injects a Docker-link env var per Service in this namespace:
      # ORDER_API_PORT, ORDER_WORKER_PORT, PRICING_PORT, FRONTEND_PORT — each
      # set to "tcp://<clusterIP>:<port>". Any app reading a variable of that
      # name as its own config gets a URL where it expected an integer:
      #   ValueError: invalid literal for int() with base 10: 'tcp://10.96...'
      # Env vars outrank every other config source, so the app cannot win.
      # Service links are a Docker-links relic nothing here uses.
      enableServiceLinks: false
      serviceAccountName: pricing
      imagePullSecrets:
        - name: {{ $.Values.global.imagePullSecret }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pricing
          image: {{ include "op.image" (dict "root" $ "img" $cfg.image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grpc, containerPort: {{ $.Values.pricing.grpcPort }} }
            - { name: http-metrics, containerPort: {{ $.Values.pricing.httpPort }} }
          env:
            - name: PRICING_VERSION
              value: {{ $version | quote }}
            - name: PRICING_GRPC_PORT
              value: {{ $.Values.pricing.grpcPort | quote }}
            - name: PRICING_HTTP_PORT
              value: {{ $.Values.pricing.httpPort | quote }}
            # PEX unpacks its dependency closure here; see the volumeMount note.
            - name: PEX_ROOT
              value: "/tmp/pex"
            - name: SERVICE_VERSION
              value: {{ $cfg.image.tag | quote }}
          # The kubelet speaks the gRPC health checking protocol itself, so the
          # app needs no HTTP endpoint and no grpc_health_probe binary in the
          # image. GRPCAction.port is an int32, not an IntOrString — a port
          # NAME is rejected by the API server, so this must be the number.
          #
          # Liveness asks for the empty service (overall server health);
          # readiness asks for the one service that has to work for this pod to
          # be worth routing to. SIGTERM flips both to NOT_SERVING before the
          # listener closes.
          livenessProbe:
            grpc: { port: {{ $.Values.pricing.grpcPort }} }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            grpc: { port: {{ $.Values.pricing.grpcPort }}, service: shop.v1.Pricing }
            periodSeconds: 5
            failureThreshold: 2
          resources: {{- toYaml $.Values.pricing.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # A PEX is a zip that unpacks its dependency closure on first run, so
          # it needs somewhere writable. Under readOnlyRootFilesystem it has
          # nowhere and dies before any of our code runs:
          #   FileNotFoundError: [Errno 2] No usable temporary directory found
          #   in ['/tmp', '/var/tmp', '/usr/tmp', '/app']
          # Note the failure is in the PEX bootstrap, so no application log line
          # ever appears — it looks like the image is broken rather than the
          # pod spec. An emptyDir plus an explicit PEX_ROOT fixes it and keeps
          # the root filesystem read-only, which is worth the four lines.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: pricing
  labels: {{- include "op.labels" (dict "name" "pricing" "root" $) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pricing
  ports:
    # Istio reads the protocol off the port name (`protocol[-suffix]`) or off
    # appProtocol. A port named `metrics` matches no protocol, so Istio falls
    # back to plain TCP and istioctl analyze reports IST0118.
    - { name: grpc, port: 50051, targetPort: grpc }
    - { name: http-metrics, port: 9090, targetPort: http-metrics }
{{- end }}
