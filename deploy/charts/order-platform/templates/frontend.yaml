{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels: {{- include "op.labels" (dict "name" "frontend" "root" $) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {{- include "op.labels" (dict "name" "frontend" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- include "op.labels" (dict "name" "frontend" "root" $) | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values | sha256sum }}
    spec:
      # Kubernetes injects a Docker-link env var per Service in this namespace:
      # ORDER_API_PORT, ORDER_WORKER_PORT, PRICING_PORT, FRONTEND_PORT — each
      # set to "tcp://<clusterIP>:<port>". Any app reading a variable of that
      # name as its own config gets a URL where it expected an integer:
      #   ValueError: invalid literal for int() with base 10: 'tcp://10.96...'
      # Env vars outrank every other config source, so the app cannot win.
      # Service links are a Docker-links relic nothing here uses.
      enableServiceLinks: false
      serviceAccountName: frontend
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: {{ include "op.image" (dict "root" $ "img" .Values.frontend.image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: {{ .Values.frontend.port }} }
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # nginx-unprivileged needs to write its pid file, client body temp
            # files and cache dirs even though the image itself is read-only.
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {{- include "op.labels" (dict "name" "frontend" "root" $) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - { name: http, port: 80, targetPort: http }
{{- if .Values.frontend.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    # Both annotations exist for one reason: this Ingress terminates outside the
    # mesh and its backend is inside it, with PeerAuthentication STRICT (§9.4).
    #
    # `service-upstream` stops NGINX load-balancing across raw pod IPs and sends
    # everything to the Service ClusterIP instead. Istio cannot identify a
    # service from a bare endpoint IP, so without this the sidecar has nothing
    # to originate mTLS *to*.
    #
    # `upstream-vhost` is the half that actually fixes it. NGINX preserves the
    # browser's `Host:` — `{{ .Values.frontend.ingress.host }}` — and Envoy routes HTTP by authority, not by
    # address. That hostname matches no service in the mesh, so the request
    # falls through to PassthroughCluster and leaves as plaintext, which the
    # destination sidecar resets. What you see at the edge is:
    #
    #   upstream connect error or disconnect/reset before headers.
    #   reset reason: connection termination
    #
    # …which reads like the backend is down. It is not; it is refusing an
    # unauthenticated connection, exactly as instructed. Rewriting the upstream
    # Host to the service FQDN lets Envoy match the real cluster and issue a
    # proper mTLS connection. Confirmed by
    # `connection_security_policy.mutual_tls` at the destination reporter.
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/upstream-vhost: "frontend.{{ .Release.Namespace }}.svc.cluster.local"
spec:
  ingressClassName: {{ .Values.frontend.ingress.className }}
  rules:
    - host: {{ .Values.frontend.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { name: http }
{{- end }}
{{- end }}
