[project]
name = "${{ values.name }}"
version = "0.1.0"
description = "${{ values.description }}"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]==0.139.2",
    "prometheus-client==0.23.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "httpx==0.28.1",
    "ruff==0.12.8",
]

# Every scaffolded service inherits the supply-chain choke point (§5.1). This
# has to live here rather than in CI: uv records the registry in uv.lock and
# refuses a lock whose registries aren't in the current index configuration, so
# an index set only in the pipeline could never match a committed lock.
[[tool.uv.index]]
url = "http://nexus:8081/repository/pypi-proxy/simple"
default = true

[tool.uv]
# Plain HTTP, per §5.8. Without this uv refuses the index outright.
allow-insecure-host = ["nexus"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
