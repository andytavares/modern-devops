apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-push
  namespace: buildkite
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nexus-push
    creationPolicy: Owner
    template:
      # Buildah reads a plain auth file, not a Kubernetes dockerconfigjson type.
      # Same JSON shape, different Secret type - so we template it as Opaque.
      type: Opaque
      data:
        config.json: |
          {
            "auths": {
              "nexus:8082": {
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef: { key: nexus, property: username }
    - secretKey: password
      remoteRef: { key: nexus, property: password }