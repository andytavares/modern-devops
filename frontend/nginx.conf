server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets built by vite.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API: the browser talks to /orders on this nginx, which
  # forwards to order-api inside the cluster. This is what lets the frontend
  # skip CORS entirely when served in-cluster (see src/api.ts VITE_API_BASE).
  location /orders {
    # Port 80, not 8000. 8000 is order-api's *container* port; the Service
    # publishes 80 and maps it to the container's `http` port. Nothing listens
    # on the ClusterIP at 8000, so the request hangs until nginx gives up and
    # returns 502 — with every order in the dashboard reading "HTTP 502" while
    # order-api itself answers 202 to a direct curl, which sends you looking at
    # the wrong service entirely.
    proxy_pass http://order-api.shop.svc.cluster.local:80/orders;
    proxy_http_version 1.1;
    proxy_set_header Host order-api.shop.svc.cluster.local;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
